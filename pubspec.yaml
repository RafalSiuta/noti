name: noti
description: "task and note manager app"
publish_to: 'none'

version: 1.0.0+10

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  timezone: ^0.11.1
  flutter_timezone: ^5.0.0
  flutter_localization: ^0.4.1
  flutter_local_notifications: ^22.2.0
  android_intent_plus: ^6.0.0
  table_calendar: ^3.2.0
  file_picker: ^12.0.0-beta.7
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  simple_animations: ^5.2.0
  carousel_slider: ^5.1.1
  photo_manager_image_provider: ^2.2.0
  photo_manager: ^3.7.1
  camera: ^0.12.0+2
  webview_flutter: ^4.13.0
  csshadow: ^0.0.2
  permission_handler: ^12.0.1
  audioplayers: ^6.5.1
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/sound.wav
    - assets/data/holidays/holidays.json
    - lang/en.json
    - lang/pl.json
    - lang/es.json

  fonts:
    - family: NotiSystemIcons
      fonts:
        - asset: assets/fonts/NotiSystemIcons.ttf

